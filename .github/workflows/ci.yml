name: CI Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.calc.outputs.new_version }}
      is_release: ${{ steps.calc.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate next version
        id: calc
        run: |
          VERSION=$(grep "project(qc VERSION" CMakeLists.txt | sed 's/.*VERSION \([^ ]*\) .*/\1/')
          echo "Current version: $VERSION"
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IFS='.' read -r major minor patch <<< "$VERSION"
            BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"
            echo "Bump type: $BUMP_TYPE"
            
            if [ "$BUMP_TYPE" == "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$BUMP_TYPE" == "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            
            NEW_VERSION="$major.$minor.$patch"
            echo "Next version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "PR build or non-main push, keeping version $VERSION"
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  build:
    name: Build and Package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Patch Version
      run: |
        perl -pi -e "s/project\(qc VERSION [0-9.]*/project(qc VERSION ${{ needs.prepare.outputs.new_version }}/" CMakeLists.txt
      shell: bash

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm dpkg-dev

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.20.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      working-directory: tests
      run: ./run_tests.sh
      shell: bash

    - name: Run CPack
      working-directory: build
      run: cpack -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qc-compiler-${{ matrix.os }}
        path: |
          build/*.zip
          build/*.tar.gz
          build/*.deb
          build/*.rpm
          build/*.dmg
          build/*.exe
          build/*.msi
        if-no-files-found: warn

  release:
    name: Tag and Release
    needs: [prepare, build]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit and Tag Version
        run: |
          perl -pi -e "s/project\(qc VERSION [0-9.]*/project(qc VERSION ${{ needs.prepare.outputs.new_version }}/" CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump version to ${{ needs.prepare.outputs.new_version }} [skip ci]"
          git tag "v${{ needs.prepare.outputs.new_version }}"
          git push origin main --tags
        shell: bash
